# Polaris Docker 版 —— 一键拉起：docker compose up -d --build
# 浏览器访问 http://localhost:8080 （若设了 POLARIS_AUTH_TOKEN，用 ?token=xxx）
services:
  polaris:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # 0=slim(默认,无渲染栈)  1=full(+chromium+fonts-noto-cjk+ffmpeg,能出 PPT/视频)
        POLARIS_RENDER: "${POLARIS_RENDER:-0}"
    # 镜像名对齐 GHCR:docker compose pull / update.sh 一键更新拉到的就是 CI 推的新镜像。
    # 本地自建时同名打 tag 即可: docker build -t ghcr.io/wuli2025/polaris:latest .
    image: ${POLARIS_IMAGE:-ghcr.io/wuli2025/polaris}:${POLARIS_TAG:-latest}
    container_name: polaris-web
    # tini 已由镜像 ENTRYPOINT 自带（不再依赖此处 init），回收 claude 子进程僵尸。
    ports:
      - "8080:8080"
      # iroh 打洞用的 UDP 口。**必须发布**,而且必须是固定口:iroh 默认随机绑,
      # 容器里随机口等于外面永远打不进来 → 打洞必失败 → 全部流量绕公共中继。
      # 这个故障不报任何错,只表现为"能用但很慢"(实测往返 12ms 变 370ms、远程盘慢 30 倍)。
      # 与下面的 POLARIS_IROH_PORT 必须同值;路由器/群晖防火墙也要放行这个 UDP 口。
      - "${POLARIS_IROH_PORT:-41641}:${POLARIS_IROH_PORT:-41641}/udp"
    environment:
      # ── 鉴权（任选其一接入 LLM）──
      # 1) Claude 官方 / 第三方 Anthropic 兼容端点：API Key 模式
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      ANTHROPIC_BASE_URL: "${ANTHROPIC_BASE_URL:-}"
      ANTHROPIC_AUTH_TOKEN: "${ANTHROPIC_AUTH_TOKEN:-}"
      # 2) 访问口令（不设则对所有可达网络开放，公网部署务必设置）
      POLARIS_AUTH_TOKEN: "${POLARIS_AUTH_TOKEN:-}"
      POLARIS_PORT: "8080"
      # 3) 单轮对话看门狗：超时(秒)未结束则杀掉 claude 进程组，防个别请求无界挂死、
      #    占住订阅并发槽拖垮后续。0=关闭，容器默认 180s。
      POLARIS_CHAT_TIMEOUT_SECS: "${POLARIS_CHAT_TIMEOUT_SECS:-180}"
      # 4) claude 全局配置目录 → 指向已持久化的 /root/.claude 卷。
      #    默认 claude 把 .claude.json 写在 HOME 根(/root/.claude.json)，不在任何卷里，
      #    容器重建即丢；且多个 headless claude 并发抢写易触发「配置文件找不到」竞态告警。
      #    指向卷内后：.claude.json + backups 落入卷，与 .credentials/settings/projects 同处，
      #    既持久又消除孤儿文件。凭证路径不变(本就在 /root/.claude/)。
      CLAUDE_CONFIG_DIR: "/root/.claude"
      # 5) 外部 GPU 推理节点(嵌入/重排/ASR)。群晖容器不开放 GPU 透传，A2 推理独立部署，
      #    经此端点对接(见 DEPLOY-SYNOLOGY.md §6)。空=走本机 CPU 兜底。
      POLARIS_INFER_ENDPOINT: "${POLARIS_INFER_ENDPOINT:-}"
      # 6) Docker 一键更新开关(默认关):
      #    设为 1 后容器内能 spawn update.sh 拉新镜像并热替换容器。
      #    启用前必须同时取消下方 volumes 里 docker.sock 挂载的注释。
      #    风险:挂 docker.sock 进容器 = 容器 = 宿主 root,生产环境慎用。
      POLARIS_DOCKER_SOCKET: "${POLARIS_DOCKER_SOCKET:-0}"
      # 7) 拉取/运行的 tag(slim=latest;full=full;锁版本用 v1.0.3 等具体 tag)
      POLARIS_TAG: "${POLARIS_TAG:-latest}"
      # 8) 邮箱服务(注册验证码/找回密码)。env 优先;不填则用 owner 在
      #    Web「邮箱服务设置」面板里存的配置(collab.db meta)。QQ 邮箱 PASS=SMTP 授权码。
      POLARIS_SMTP_HOST: "${POLARIS_SMTP_HOST:-}"
      POLARIS_SMTP_PORT: "${POLARIS_SMTP_PORT:-}"
      POLARIS_SMTP_USER: "${POLARIS_SMTP_USER:-}"
      POLARIS_SMTP_PASS: "${POLARIS_SMTP_PASS:-}"
      POLARIS_SMTP_FROM: "${POLARIS_SMTP_FROM:-}"
      POLARIS_EMAIL_SIGNUP: "${POLARIS_EMAIL_SIGNUP:-}"
      # ── 账号权威(「一个账号在哪台机器都能登」)──
      # 本机当账号中心:设 POLARIS_ACCOUNT_AUTHORITY=1。它持账号签名私钥
      #   /root/Polaris/data/account_authority.key(在 polaris-data 卷里,随卷备份;
      #   丢了所有成员主机都要重新信任)。
      # 本机是成员主机:改填 POLARIS_ACCOUNT_AUTHORITY_URL=https://你的账号中心。
      # 两个都不设 = 老行为(本机 collab.db 自己管账号),现有部署零影响。
      POLARIS_ACCOUNT_AUTHORITY: "${POLARIS_ACCOUNT_AUTHORITY:-}"
      POLARIS_ACCOUNT_AUTHORITY_URL: "${POLARIS_ACCOUNT_AUTHORITY_URL:-}"
      # 自助注册默认关(邀请制) —— 放开等于任何人都能拿到本机 collaborator 会话
      POLARIS_ACCOUNT_OPEN_SIGNUP: "${POLARIS_ACCOUNT_OPEN_SIGNUP:-}"
      # ── 互联（iroh 隧道 / 远程盘）──
      # 9) 固定 UDP 口:要与上面 ports 里发布的那个一致(理由见 ports 处注释)。
      POLARIS_IROH_PORT: "${POLARIS_IROH_PORT:-41641}"
      # 10) 中继(逗号分隔,可选)。打洞成功时用不上,打洞失败时它是唯一兜底 ——
      #     不设就会落到 n0 的公共中继(可能在欧洲,每跳往返几百毫秒)。
      POLARIS_RELAYS: "${POLARIS_RELAYS:-}"
      # 11) 主机隧道开机自启。不设的话每次容器重建都得手动 POST 一次
      #     /api/collab/tunnel/start,否则对端一直等不到应答(现象是"远程盘挂不上",
      #     完全看不出是少了一条启动指令)。
      POLARIS_TUNNEL_AUTOSTART: "${POLARIS_TUNNEL_AUTOSTART:-1}"
      # 12) 性能旋钮(留空=按机器自适应):隧道 worker 数默认取 CPU 核数、转发缓冲默认
      #     256KB(内存紧张的 NAS 可调到 32)、远程盘传输压缩级别默认 3(设 0 关闭)。
      #     压缩是拿 CPU 换带宽:文本/代码/日志能压掉几倍,小带宽出口收益最大。
      POLARIS_TUNNEL_WORKERS: "${POLARIS_TUNNEL_WORKERS:-}"
      POLARIS_TUNNEL_BUF_KB: "${POLARIS_TUNNEL_BUF_KB:-}"
      POLARIS_FS_ZSTD_LEVEL: "${POLARIS_FS_ZSTD_LEVEL:-}"
    volumes:
      # 数据持久化（KB / 对话历史 / 项目 / 产物 / 技能）：容器重建不丢
      - polaris-data:/root/Polaris
      # claude 凭证 + settings（供应商切换、OAuth 登录态）
      - polaris-claude:/root/.claude
      # kb 设置等 XDG 配置
      - polaris-config:/root/.config
      # 可选：把宿主 docker.sock 挂进容器,让容器内能调 update.sh 实现 Web UI 一键更新。
      # 启用方法:取消下面这行注释 + 上方 environment 段把 POLARIS_DOCKER_SOCKET 设成 "1"。
      # 安全:挂 sock 后容器进程对宿主 docker daemon 有 root 权限,务必配合 POLARIS_AUTH_TOKEN 使用。
      # - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
    # ── 工业级加固(Forge 工业级化阶段 0)─────────────────────────────
    # 内存上限：防单容器泄漏拖垮宿主；超限 OOM kill 本容器，宿主与其它容器存活。
    # （注：群晖内核缺 CFS 模块，CPU 硬限速 cpus= 不生效,full 模式建议改用 cpuset 绑核）
    mem_limit: 4g            # full 默认 4g（chromium + ffmpeg + 2 并发渲染峰值 ~3GB）
    mem_reservation: 2g      # soft 限制,确保空闲时不被挤压
    # chromium 截大页默认 /dev/shm(64MB)易崩 → 调大(full 渲染必备; slim 无害)。
    # 公众号链路(headless=False 走 Xvfb)并发标签多了 512MB 也吃紧 → 1g 更稳。
    shm_size: "1g"
    # ── 进程数上限:防 fork bomb(claude spawn + chromium 多进程树)─────
    pids_limit: 512
    # ── CPU 限制(非群晖):默认 2 核够 chromium+ffmpeg 并发渲染不串────
    cpus: "2.0"
    # ── ulimit nofile:chromium 一标签页 50+ socket,默认 1024 必爆 EMFILE
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    # ── 五重安全加固(任务 d §1.3-1.4)──────────────────────────────
    # cap-drop ALL + cap-add 最小集;不开放 SYS_ADMIN(防容器逃逸)
    cap_drop:
      - ALL
    cap_add:
      - CHOWN       # entrypoint gosu 降权所需
      - SETUID
      - SETGID
      - DAC_OVERRIDE
    # seccomp + no-new-privileges + apparmor(任务 d §1.4)
    # seccomp profile 拷入镜像:/etc/docker/seccomp/chromium.json
    # (用 jfrazelle/dotfiles chrome.json 事实标准,任务 d 引文[16])
    security_opt:
      - "no-new-privileges:true"
      # 本机/默认部署:用 Docker 默认 seccomp profile(已经够严)
      # 群晖加固场景:把 chromium.json 放到宿主 /etc/docker/seccomp/ 再启用下一行
      # - "seccomp=/etc/docker/seccomp/chromium.json"
    # ── 日志轮转：防 stdout 无限增长写满系统分区。─────────────────
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      # full 模式慢启动(SC 字体子集 + preflight 探测 + chromium 冷启动)→ 60s 起步窗口
      start_period: 60s

volumes:
  polaris-data: {}
  polaris-claude: {}
  polaris-config: {}
